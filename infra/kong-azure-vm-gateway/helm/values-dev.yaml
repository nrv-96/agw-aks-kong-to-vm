# Development / low-cost profile for the single-node AKS environment.
# The internal Azure LoadBalancer is required by Application Gateway; the static
# private IP is injected by kong-install.sh from config.kong.internal_lb_ip.
# For a local kind cluster, override proxy.type=ClusterIP and port-forward.
gateway:
  # One replica for the dev profile. Production replicas come from
  # config/config.yaml -> kong.replicas, which the scripts pass with --set.
  replicaCount: 1

  proxy:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  podDisruptionBudget:
    enabled: false

  # A single replica cannot satisfy a spread constraint; keep it advisory.
  topologySpreadConstraints: []

controller:
  ingressController:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
