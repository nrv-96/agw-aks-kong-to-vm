# Key Vault CA trust material for Kong.
#
# The public root CA is stored in Key Vault as a *secret containing PEM*
# (object type `secret`, e.g. the contents of root-ca.crt). Do not store it as a
# Key Vault certificate object: those are delivered as PKCS#12 blobs which Kong
# cannot consume as a PEM trust anchor.
#
# KIC requires TWO keys in every CA Secret it consumes:
#   - `ca.crt`: the PEM trust anchor
#   - `id`:     a stable UUID that becomes the Kong `ca_certificates` entity ID
# KIC ignores (and reports a translation failure for) Secrets missing `id`, so
# the UUID is stored as its own Key Vault secret and synced alongside the PEM.
# See config/config.yaml -> certificates.root_ca_id_name.
#
# The CSI driver:
#   - mounts both files into the Kong Gateway pod at /etc/kong/trust
#   - syncs them into the Kubernetes Secret ${CA_SECRET_NAME}
#
# The synced Secret is what KIC's BackendTLSPolicy consumes. The CSI provider
# already sets the required label `konghq.com/ca-cert=true`;
# scripts/apply-kong-resources.sh adds the `kubernetes.io/ingress.class`
# annotation because CSI cannot set annotations.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pairs-monitor-ca
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: pairs-monitor
spec:
  provider: azure
  secretObjects:
    - secretName: ${CA_SECRET_NAME}
      type: Opaque
      labels:
        konghq.com/ca-cert: "true"
      data:
        # objectName must match the file name in the CSI volume, i.e. the
        # objectAlias defined below (not the Key Vault object name).
        - objectName: ca.crt
          key: ca.crt
        - objectName: id
          key: id
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # Workload identity client ID (federated credential on the AKS OIDC issuer).
    clientID: "${WORKLOAD_IDENTITY_CLIENT_ID}"
    keyvaultName: "${KEYVAULT_NAME}"
    cloudName: ""
    tenantId: "${TENANT_ID}"
    # Stable mount/file names: ca.crt (PEM) and id (UUID). Kong adds
    # /etc/kong/trust/ca.crt to lua_ssl_trusted_certificate so *active* HTTPS
    # health checks can verify the private CA as well (Kong Service
    # ca_certificates do not apply to health checks).
    objects: |
      array:
        - |
          objectName: ${ROOT_CA_OBJECT}
          objectType: secret
          objectAlias: ca.crt
        - |
          objectName: ${ROOT_CA_ID_OBJECT}
          objectType: secret
          objectAlias: id
