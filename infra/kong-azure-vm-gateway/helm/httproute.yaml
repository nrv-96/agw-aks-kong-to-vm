# Public HTTPS route + HTTP->HTTPS redirect.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pairs-monitor
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: pairs-monitor
spec:
  parentRefs:
    - name: pairs-monitor-gateway
      sectionName: https
  hostnames:
    - ${PUBLIC_HOSTNAME}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: pairs-monitor-backend
          port: ${BACKEND_PORT}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pairs-monitor-http-redirect
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: pairs-monitor
spec:
  parentRefs:
    - name: pairs-monitor-gateway
      sectionName: http
  hostnames:
    - ${PUBLIC_HOSTNAME}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
